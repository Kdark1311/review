<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sản phẩm trong video</title>
<meta name="description" content="Link sản phẩm theo mã số video">
<style>
  :root { --bg:#16161c; --card:#22222b; --text:#f2f2f5; --muted:#9a9aa8; --accent:#8b5cf6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .note { color:var(--muted); font-size:13px; margin:0 0 16px; }
  input { width:100%; padding:14px 16px; font-size:18px; border-radius:12px; border:2px solid var(--card);
          background:var(--card); color:var(--text); margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--accent); }
  a.item { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:14px; padding:10px;
           margin-bottom:12px; color:inherit; text-decoration:none; border:2px solid transparent; }
  a.item:hover, a.item:focus-visible, a.item:target { border-color:var(--accent); }
  .item img { width:84px; height:84px; border-radius:10px; object-fit:cover; flex:none; }
  .code { color:var(--accent); font-weight:800; font-size:20px; }
  .name { font-weight:600; }
  .buy { display:inline-block; margin-top:6px; background:var(--accent); color:#fff; font-weight:700;
         font-size:14px; padding:6px 12px; border-radius:999px; }
  .empty { color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Sản phẩm trong video</h1>
  <p class="note">Nhập mã số ở cuối video. Đây là link tiếp thị liên kết: mình nhận hoa hồng nếu bạn mua, giá bạn trả không đổi.</p>
  <input id="q" type="search" inputmode="numeric" placeholder="Nhập mã số, ví dụ 01" aria-label="Mã số sản phẩm">
  <div id="list"></div>
</main>
<script>
// Mỗi video mới: thêm 1 dòng LÊN ĐẦU danh sách.
const PRODUCTS = [
  { code: "01", name: "Bàn phím cơ AULA F75", img: "img/01.jpg", url: "https://s.shopee.vn/7fbZEYX0IC" },
];

const list = document.getElementById("list"), q = document.getElementById("q");
function render() {
  const k = q.value.trim().replace(/^#/, "");
  const shown = PRODUCTS.filter(p => !k || p.code.includes(k) || p.name.toLowerCase().includes(k.toLowerCase()));
  list.innerHTML = shown.length ? shown.map(p => `
    <a class="item" id="m${p.code}" href="${p.url}" target="_blank" rel="noopener sponsored">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div><div class="code">#${p.code}</div><div class="name">${p.name}</div><span class="buy">Xem trên Shopee</span></div>
    </a>`).join("") : '<p class="empty">Không tìm thấy mã này.</p>';
}
q.addEventListener("input", render);
render();
</script>
</body>
</html>
